# Render Blueprint — New + → Blueprint → pick this repo. Free web service, no card needed.
services:
  - type: web
    name: aml-copilot
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SEED_SIZE
        value: full
      - key: LLM_ENABLED
        value: "true"
      - key: ANTHROPIC_API_KEY
        sync: false          # optional — leave blank for the rules engine
      - key: AUTH_SECRET
        generateValue: true
      - key: DEMO_PASSWORD
        value: demo1234
